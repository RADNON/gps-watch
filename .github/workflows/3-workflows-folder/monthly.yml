name: Monthly report

on:
  schedule:
    - cron: "50 4 1 * *"   # 1st of each month, 07:50 Bahrain time
  workflow_dispatch:
    inputs:
      month:
        description: "Month to report, e.g. 2026-10 (leave empty for last month)"
        required: false

permissions:
  contents: write

concurrency:
  group: gps-watch
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install encryption tool
        run: python -m pip install --quiet cryptography

      - name: Build and email the monthly report
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALARM_TO: ${{ secrets.ALARM_TO }}
          REPORT_MONTH: ${{ inputs.month }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          DASHBOARD_PASSWORD_OLD: ${{ secrets.DASHBOARD_PASSWORD_OLD }}
        run: python monitor.py monthly

      - name: Save report
        if: always()
        run: |
          git config user.name "gps-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports
          if ! git diff --cached --quiet; then
            git commit -m "Monthly report"
            git pull --rebase --quiet && git push --quiet
          fi
