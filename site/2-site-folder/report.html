<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monthly Report</title>
<style>
  html, body { margin:0; height:100%; background:#f3f5f7; font-family:"Segoe UI",Arial,sans-serif; }
  iframe { border:0; width:100%; height:100%; display:block; }
  .msg { padding:40px 20px; text-align:center; color:#5b6573; }
</style>
</head>
<body>
<div class="msg" id="msg">Loading…</div>
<script src="lock.js"></script>
<script>
(async () => {
  const m = new URLSearchParams(location.search).get("m") || "";
  const msg = document.getElementById("msg");
  if (!/^\d{4}-\d{2}$/.test(m)) { msg.textContent = "Report not found."; return; }
  try {
    const env = await fetch("reports/" + m + ".enc?ts=" + Date.now()).then(r => { if (!r.ok) throw 0; return r.json(); });
    msg.textContent = "";
    const { text } = await GPSLock.unlock(env, "Monthly report " + m);
    const f = document.createElement("iframe");
    f.setAttribute("sandbox", "allow-popups allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation");
    f.srcdoc = text.replace("<head>", '<head><base target="_top">');
    msg.remove(); document.body.appendChild(f);
  } catch (e) { msg.textContent = "Report not found."; }
})();
</script>
</body>
</html>
